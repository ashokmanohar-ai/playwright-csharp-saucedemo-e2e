name: Playwright C# E2E

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: ${{ matrix.browser }} E2E
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore PlaywrightSauceDemo.sln

      - name: Build
        run: dotnet build PlaywrightSauceDemo.sln --configuration Release --no-restore

      - name: Install Playwright browser
        shell: pwsh
        run: src/PlaywrightSauceDemo.Tests/bin/Release/net8.0/playwright.ps1 install --with-deps ${{ matrix.browser }}

      - name: Run E2E tests
        env:
          SAUCE_BASE_URL: https://www.saucedemo.com
          SAUCE_USERNAME: standard_user
          SAUCE_PASSWORD: secret_sauce
        run: >-
          dotnet test PlaywrightSauceDemo.sln
          --configuration Release
          --no-build
          --settings runsettings/${{ matrix.browser }}.runsettings
          --logger "trx;LogFileName=${{ matrix.browser }}.trx"
          --results-directory TestResults/${{ matrix.browser }}

      - name: Upload test results and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.browser }}-results
          path: |
            TestResults/${{ matrix.browser }}/**/*
            **/evidence/**/*
          if-no-files-found: ignore
          retention-days: 14
